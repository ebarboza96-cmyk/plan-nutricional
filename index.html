<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mi Plan Nutricional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5fb;--card:#fff;--ink:#1c1b22;--mut:#6c6a78;--line:#e7e5f0;
  --pur:#8b7cf6;--pur2:#6d5dd3;--purbg:#f0edff;--red:#e11d2e;
  --warn:#c2410c;--warnbg:#fff1e8;--ok:#1f8a4c;--okbg:#e8f6ee;--r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4}
button{font:inherit;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
input,select{font:inherit;font-size:16px}
.topline{height:6px;background:var(--pur)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 90px}
header{padding:14px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
header h1 small{display:block;font-size:11px;font-weight:600;color:var(--pur2);letter-spacing:.12em;text-transform:uppercase}
header .sync{font-size:11px;color:var(--mut);text-align:right;max-width:46%}
.people{display:flex;gap:6px;margin:4px 0 8px;overflow-x:auto;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.people button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--mut)}
.people button.on{border-color:var(--pur2);color:var(--pur2);background:var(--purbg)}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav.tabs button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 2px;font-size:13px;font-weight:600;color:var(--mut)}
nav.tabs button.on{background:var(--pur2);border-color:var(--pur2);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px;font-weight:800}
.mut{color:var(--mut)} .small{font-size:12.5px}
.red{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:12.5px;color:var(--mut);font-weight:600}
label.f input,label.f select{display:block;width:100%;margin-top:4px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fbfbfe;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:#fafaff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--mut)}
.stat.hl{background:var(--purbg);border-color:#dcd6ff}
.stat.hl b{color:var(--pur2)}
.stat .up{color:var(--ok)} .stat .dn{color:var(--ok)}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.info{background:var(--purbg);color:#3f348f;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--red);font-weight:700}
td.n,th.n{text-align:center}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar{height:7px;background:#eeedf4;border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .25s ease}
.bar i.over{background:var(--warn)!important}
.big{display:flex;align-items:baseline;gap:6px}
.big b{font-size:28px;font-weight:800;letter-spacing:-.03em}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datenav button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px}
.datenav .d{text-align:center;font-weight:700}
.datenav .d small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.glasses{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.glasses span{width:16px;height:20px;border-radius:3px 3px 5px 5px;border:1.5px solid #8bb8d9;background:#fff}
.glasses span.f{background:#5fa3d6;border-color:#5fa3d6}
.btn{border:1px solid var(--line);background:#fbfbfe;border-radius:10px;padding:8px 12px;font-weight:600}
.btn.p{background:var(--pur2);border-color:var(--pur2);color:#fff}
.btn.full{width:100%;margin-top:10px;padding:11px}
.btn:active,.pm button:active,.add:active{transform:scale(.96)}
.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.checks button{border:1.5px solid var(--line);background:#fbfbfe;border-radius:12px;padding:9px 4px;font-size:12.5px;font-weight:600;color:var(--mut);line-height:1.25}
.checks button.on{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.meal{border-left:4px solid var(--pur)}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.mh b{color:var(--red);font-size:15px;text-transform:uppercase;letter-spacing:.03em;font-weight:800}
.mh span{font-weight:700;font-size:13.5px}
.mnote{font-size:12.5px;color:var(--red);font-weight:600;margin-bottom:4px}
.grow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.grow:last-of-type{border-bottom:0}
.grow .t{font-weight:600;font-size:14px}
.grow .t small{font-weight:500;color:var(--mut);margin-left:4px}
.grow .t .ok{color:var(--ok);font-weight:700}
.pm{display:flex;gap:6px}
.pm button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fbfbfe;font-size:18px;font-weight:700;color:var(--ink)}
.pm button.plus{background:var(--pur2);border-color:var(--pur2);color:#fff}
.entries{margin-top:6px}
.entry{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:13.5px}
.entry .x{flex:1;min-width:0}
.entry .x div{font-size:12px;color:var(--mut)}
.entry .pm button{width:30px;height:30px;font-size:15px}
.linkbtn{border:0;background:none;color:var(--pur2);font-weight:700;font-size:13px;padding:8px 0 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:#fbfbfe;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--mut)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fbfbfe;margin-bottom:8px}
.food{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.food:last-child{border-bottom:0}
.food .x{flex:1;min-width:0}
.food .x b{font-weight:600;font-size:14px}
.food .x div{font-size:12.5px;color:var(--mut)}
.add{flex:none;width:38px;height:38px;border-radius:10px;border:0;background:var(--purbg);color:var(--pur2);font-size:20px;font-weight:700}
.mealsel{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.mealsel::-webkit-scrollbar{display:none}
.mealsel button{flex:none;border:1px solid var(--line);background:#fbfbfe;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;color:var(--mut)}
.mealsel button.on{background:var(--purbg);border-color:var(--pur2);color:var(--pur2)}
.empty{color:var(--mut);font-size:13.5px;padding:6px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:all .2s ease;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* Plan estilo MAJO */
.plan h3{margin:14px 0 2px;color:var(--red);font-size:14.5px;font-weight:800;text-transform:uppercase;display:flex;justify-content:space-between}
.plan h3 span{color:var(--ink);text-transform:none}
.plan h3:first-of-type{margin-top:0}
.plan .it{font-weight:700;font-size:14px;text-transform:uppercase;padding:2px 0}
.plan .it small{color:var(--mut);font-weight:500;text-transform:none}
.recs{border:1.5px solid var(--pur);border-radius:6px;overflow:hidden}
.recs div{padding:9px 12px;border-top:1px solid var(--pur);font-weight:600;font-size:14px}
.recs div:first-child{border-top:0;text-align:center;font-weight:800;font-size:15px}
.recs div.r{color:var(--red)}
.edrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.edrow label{font-size:11px;color:var(--mut);font-weight:600;text-align:center}
.edrow input{width:100%;padding:8px 2px;text-align:center;border:1px solid var(--line);border-radius:8px;margin-top:3px}
.ghdr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ghdr h2{margin:0 0 6px}
.ghdr .eq{font-size:12px;font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
@media (min-width:600px){.stats{grid-template-columns:repeat(4,1fr)} .twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
</style>
</head>
<body>
<div class="topline"></div>
<div class="wrap">
  <header>
    <h1><small>Plan de alimentación</small><span id="who">—</span></h1>
    <div class="sync" id="sync">📱 Guardando en este dispositivo</div>

    <button data-tab="hoy">Hoy</button>

function migrate(ppl){
  if(!ppl||!Array.isArray(ppl.list)) return null;
  ppl.list=ppl.list.map(x=> x.id==='novia'&&!x.fuente ? noviaDefault() : x);
  return ppl;
}

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1 = x => Math.round(x*10)/10;
const fx = x => { const v = r1(x); return Number.isInteger(v) ? String(v) : v.toFixed(1); };
const nf = x => Math.round(x).toLocaleString('es-CR');
function todayStr(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function shiftDate(s,n){ const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return todayStr(dt); }
function shortDate(s){ const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y.slice(2); }
function prettyDate(s){
  const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d), t=todayStr();
  const lbl = s===t?'Hoy':s===shiftDate(t,-1)?'Ayer':s===shiftDate(t,1)?'Mañana':'';
  const full = dt.toLocaleDateString('es-CR',{weekday:'long',day:'numeric',month:'long'});
  return {lbl: lbl || full.charAt(0).toUpperCase()+full.slice(1), full};
}
let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1600); }
function exText(ex){ return Object.entries(ex).filter(([,v])=>v).map(([k,v])=>fx(v)+' '+(v===1?G[k].s:G[k].pl)).join(' + '); }
function exKcal(ex){ return Object.entries(ex).reduce((s,[k,v])=>s+(G[k]?G[k].k*v:0),0); }
function sumEx(list){ const s={car:0,pro:0,gra:0,fru:0,veg:0,lac:0,azu:0}; for(const ex of list) for(const [k,v] of Object.entries(ex)) if(k in s) s[k]+=v; return s; }
function macros(s){ let k=0,c=0,p=0,g=0; for(const key of GK){ k+=G[key].k*s[key]; c+=G[key].c*s[key]; p+=G[key].p*s[key]; g+=G[key].g*s[key]; } return {k,c,p,g}; }
function distribute(total,w){
  const raw=w.map(x=>x*total), base=raw.map(Math.floor); let rem=total-base.reduce((a,b)=>a+b,0);
  const ord=raw.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]);
  for(let j=0;j<ord.length&&rem>0;j++){ if(w[ord[j][1]]>0){ base[ord[j][1]]++; rem--; } }
  return base;
}

function lsSet(k,v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){} }

function setSync(m){ $('#sync').textContent = m==='sync'?'☁️ Guardado en su cuenta':m==='err'?'⚠️ No se pudo sincronizar':'📱 Guardando en este dispositivo'; }
async function remoteGet(k){ if(!DB||!UID) return null; try{ const s=await DB.collection('data/users/'+UID).doc(k).get(); return s.exists?JSON.parse(JSON.stringify(s.data())):null; }catch(e){ return null; } }

/* ============ Cálculo de gasto y generador de plan ============ */
const ACT=[[1.2,'Sedentario','Trabajo sentado, casi sin ejercicio'],[1.375,'Ligero','Ejercicio 1–3 días/semana'],[1.55,'Moderado','Ejercicio 3–5 días/semana'],[1.725,'Activo','Ejercicio intenso 6–7 días/semana'],[1.9,'Muy activo','Trabajo físico + entrenamiento']];
const OBJ={perder:{f:.8,n:'Bajar grasa',d:'déficit 20%'},suave:{f:.9,n:'Bajar grasa suave',d:'déficit 10%'},mantener:{f:1,n:'Mantener',d:'sin déficit'},ganar:{f:1.1,n:'Ganar músculo',d:'superávit 10%'}};
function currentWeight(p){ const c=(p.citas||[]).slice().sort((a,b)=>a.f<b.f?-1:1); return c.length ? +c[c.length-1].peso : +p.peso; }
function energy(p){
  const w=currentWeight(p), h=+p.altura, a=+p.edad; if(!(w>0&&h>0&&a>0)) return null;
  const male=p.sexo!=='f', bmr=10*w+6.25*h-5*a+(male?5:-161), tdee=bmr*(+p.act||1.375);
  const o=OBJ[p.obj]||OBJ.perder; let meta=Math.round(tdee*o.f/10)*10, floored=false;
  const fl=male?1500:1200; if(meta<fl){ meta=fl; floored=true; }
  const hm=h/100, imc=w/(hm*hm);
  return {w,bmr,tdee,meta,floored,imc,male,ref: imc>30?27*hm*hm:w};
}
/* Genera un plan con la MISMA estructura que el de Emmanuel */
function generatePlan(p){
  const e=energy(p); if(!e) return null;
  const fixed = 2*G.fru.k + G.veg.k;              // batido verde
  const Pg = 1.5*e.ref;                            // proteína g/día
  const carbGuess = Math.round((e.meta-fixed)*0.40/G.car.k);
  const pro = Math.max(5, Math.round((Pg - carbGuess*3)/7));
  const gra = e.meta>=2200?4:e.meta>=1700?3:2;
  const car = Math.max(4, Math.round((e.meta - fixed - pro*G.pro.k - gra*G.gra.k)/G.car.k));
  // misma proporción por tiempo que el plan de MAJO (almuerzo / merienda / cena)
  const dc=distribute(car,[0,4/9,2/9,3/9]), dp=distribute(pro,[0,10/20,3/20,7/20]), dg=distribute(gra,[0,.5,0,.5]);
  return BASE_MEALS.map((m,i)=>({...m, ex: i===0?{fru:2,veg:1}:{car:dc[i],pro:dp[i],gra:dg[i]}}));
}
function planTotals(p){ return p.meals ? sumEx(p.meals.map(m=>m.ex)) : null; }

    <div class="checks">
      <button data-act="chk" data-k="te" class="${chk.te?'on':''}">🍵 Té canela / jengibre</button>

function guessMeal(p){ const h=new Date().getHours(); const i=h<10?0:h<14?1:h<17?2:3; return (p.meals[i]||p.meals[0]).n; }
function renderFoods(){

}

/* ---- PROGRESO ---- */
function vProg(){
  const p=P();
  const c=(p.citas||[]).slice().sort((a,b)=>a.f<b.f?-1:1);
  const first=c[0], last=c[c.length-1];
  const diff=(k,inv)=>{ if(!first||!last||first===last) return ''; const d=last[k]-first[k]; const good=inv?d>0:d<0; return `<span style="color:${Math.abs(d)<0.05?'var(--mut)':good?'var(--ok)':'var(--warn)'}">${d>0?'+':''}${fx(d)}</span>`; };
  const tbl = c.length?`<div class="scrollx"><table><thead><tr><th>Fecha</th><th class="n">Peso kg</th><th class="n">Grasa %</th><th class="n">Músculo kg</th><th class="n">GV</th><th class="n">H2O</th><th></th></tr></thead><tbody>
    ${c.map(r=>`<tr><td><b>${shortDate(r.f)}</b></td><td class="n">${fx(r.peso)}</td><td class="n">${r.grasa!==''&&r.grasa!=null?fx(r.grasa)+'%':'–'}</td><td class="n">${r.musc!==''&&r.musc!=null?fx(r.musc):'–'}</td><td class="n">${r.gv!==''&&r.gv!=null?fx(r.gv):'–'}</td><td class="n">${r.h2o!==''&&r.h2o!=null?fx(r.h2o):'–'}</td><td><button class="linkbtn" style="padding:0;color:var(--mut)" data-act="delcita" data-f="${r.f}">×</button></td></tr>`).join('')}
    </tbody></table></div>`:'<div class="empty">Todavía no hay citas registradas.</div>';
  return `
  ${c.length>1?`<div class="card"><h2>Avance desde ${shortDate(first.f)}</h2><div class="stats">
    <div class="stat"><span>Peso</span><b>${diff('peso')} kg</b><span>${fx(first.peso)} → ${fx(last.peso)}</span></div>
    <div class="stat"><span>Grasa</span><b>${diff('grasa')} %</b><span>${fx(first.grasa)} → ${fx(last.grasa)}%${p.metaGrasa?' · meta '+esc(p.metaGrasa):''}</span></div>
    <div class="stat"><span>Músculo</span><b>${diff('musc',1)} kg</b><span>${fx(first.musc)} → ${fx(last.musc)}</span></div>
    <div class="stat"><span>Grasa visceral</span><b>${diff('gv')}</b><span>${fx(first.gv)} → ${fx(last.gv)}</span></div></div></div>`:''}
  <div class="card"><h2 class="red">CONTROL DE CITAS</h2>${tbl}
    <h2 style="margin-top:14px;font-size:14px">Agregar medición</h2>
    <div class="grid2">
      <label class="f">Fecha<input id="c-f" type="date" value="${todayStr()}"></label>
      <label class="f">Peso (kg)<input id="c-peso" type="number" step="0.1" inputmode="decimal"></label>
      <label class="f">Grasa %<input id="c-grasa" type="number" step="0.1" inputmode="decimal"></label>
      <label class="f">Músculo (kg)<input id="c-musc" type="number" step="0.1" inputmode="decimal"></label>
      <label class="f">Grasa visceral<input id="c-gv" type="number" step="1" inputmode="numeric"></label>
      <label class="f">Agua corporal %<input id="c-h2o" type="number" step="0.1" inputmode="decimal"></label>
    </div>
    <button class="btn p full" data-act="addcita">Guardar medición</button>
  </div>
  <div class="card"><h2>Datos de ${esc(p.nombre)}</h2>
    <div class="grid2">
      <label class="f">Nombre<input data-pf="nombre" value="${esc(p.nombre)}"></label>
      <label class="f">Apellido<input data-pf="apellido" value="${esc(p.apellido)}"></label>
      <label class="f">Estatura (cm)<input data-pf="altura" type="number" step="0.5" inputmode="decimal" value="${esc(p.altura)}"></label>
      <label class="f">Edad<input data-pf="edad" type="number" inputmode="numeric" value="${esc(p.edad)}"></label>
      ${c.length?'':`<label class="f">Peso actual (kg)<input data-pf="peso" type="number" step="0.1" inputmode="decimal" value="${esc(p.peso)}"></label>`}
      <label class="f">Sexo<select data-pf="sexo"><option value="m" ${p.sexo!=='f'?'selected':''}>Hombre</option><option value="f" ${p.sexo==='f'?'selected':''}>Mujer</option></select></label>
    </div>
    <label class="f" style="margin-top:10px">Actividad<select data-pf="act">${ACT.map(a=>`<option value="${a[0]}" ${+p.act===a[0]?'selected':''}>${a[1]} — ${a[2]}</option>`).join('')}</select></label>
    <label class="f" style="margin-top:10px">Objetivo<select data-pf="obj">${Object.entries(OBJ).map(([k,o])=>`<option value="${k}" ${p.obj===k?'selected':''}>${o.n} (${o.d})</option>`).join('')}</select></label>
    <div id="energy"></div>
    ${p.fuente
      ? `<p class="small mut" style="margin:10px 0 0">El plan de ${esc(p.nombre)} es el de su nutricionista y no se recalcula solo. Si le cambian intercambios, use <b>Plan → Editar plan</b>.</p>`
      : `<button class="btn p full" data-act="gen">${p.meals?'Volver a generar plan':'Generar plan'} con estos datos</button>
         <p class="small mut" style="margin:8px 0 0">Usa la misma estructura del plan de Emmanuel (batido verde, almuerzo, merienda, cena) ajustada a las calorías de ${esc(p.nombre)}. Si tiene alguna condición médica, conviene que lo revise una nutricionista.</p>`}
  </div>`;
}
function renderEnergy(){
  const el=$('#energy'); if(!el) return; const e=energy(P());
  el.innerHTML = e?`<div class="stats" style="margin-top:12px">
    <div class="stat"><span>IMC</span><b>${fx(e.imc)}</b></div>
    <div class="stat"><span>Metabolismo basal</span><b>${nf(e.bmr)}</b><span>kcal</span></div>
    <div class="stat"><span>Gasto diario</span><b>${nf(e.tdee)}</b><span>kcal</span></div>
    <div class="stat hl"><span>Meta sugerida</span><b>${nf(e.meta)}</b><span>kcal</span></div></div>
    ${e.floored?`<div class="note">Se ajustó al mínimo recomendado (${nf(e.meta)} kcal).</div>`:''}`
    : `<div class="info">Complete estatura, edad y peso para calcular el gasto calórico.</div>`;
}

/* ============ Acciones ============ */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function addEntry(meal,name,pp,ex,gen){
  const L=state.day.entries, last=L[L.length-1];
  if(last&&last.name===name&&last.m===meal&&JSON.stringify(last.ex)===JSON.stringify(ex)) last.n+=1;
  else L.push({id:uid(),name,p:pp,ex,n:1,m:meal,gen:!!gen});
  saveDay();
}
function keepScroll(fn){ const y=window.scrollY; fn(); render(); window.scrollTo(0,y); }
document.addEventListener('click', ev=>{
  const tb=ev.target.closest('[data-tab]'); if(tb){ state.tab=tb.dataset.tab; state.edit=false; render(); window.scrollTo(0,0); return; }
  const pb=ev.target.closest('[data-person]');
  if(pb){ state.people.active=pb.dataset.person; savePeople(); state.meal=null; state.edit=false; state.day=lsGet(dayKey(state.date))||blankDay(); render(); loadDay().then(()=>render()); return; }
  const b=ev.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, d=state.day, p=P();
  if(a==='prev'||a==='next'){ state.date=shiftDate(state.date,a==='prev'?-1:1); state.day=lsGet(dayKey(state.date))||blankDay(); render(); loadDay().then(()=>{ if(state.tab==='hoy') render(); }); return; }
  if(a==='w') return keepScroll(()=>{ d.agua=Math.max(0,d.agua+(+b.dataset.v)); saveDay(); });
  if(a==='chk') return keepScroll(()=>{ d.chk=d.chk||{}; d.chk[b.dataset.k]=!d.chk[b.dataset.k]; saveDay(); });
  if(a==='gplus') return keepScroll(()=>addEntry(b.dataset.m,'1 '+G[b.dataset.g].s,'',{[b.dataset.g]:1},true));
  if(a==='gminus') return keepScroll(()=>{
    const g=b.dataset.g, m=b.dataset.m;
    for(let i=d.entries.length-1;i>=0;i--){ const e=d.entries[i]; if(e.m===m&&e.ex[g]){ if(e.n>1) e.n-=1; else d.entries.splice(i,1); saveDay(); break; } }
  });
  if(a==='eplus'||a==='eminus'||a==='edel') return keepScroll(()=>{
    const i=d.entries.findIndex(x=>x.id===b.dataset.id); if(i<0) return; const e=d.entries[i];
    if(a==='eplus') e.n+=1; else if(a==='eminus'&&e.n>1) e.n-=1; else d.entries.splice(i,1); saveDay();
  });
  if(a==='addto'){ state.meal=b.dataset.m; render(); const c=$('#addcard'); if(c) c.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(a==='meal'){ state.meal=b.dataset.m; document.querySelectorAll('.mealsel button').forEach(x=>x.classList.toggle('on',x.dataset.m===state.meal)); return; }
  if(a==='chip'){ state.chip=b.dataset.c; state.q=''; const q=$('#q'); if(q) q.value=''; renderFoods(); return; }
  if(a==='addf'){ const f=FOODS.find(x=>x.id===b.dataset.id); if(!f) return; keepScroll(()=>addEntry(state.meal,f.n,f.p,f.ex)); toast('✓ '+f.n+' → '+state.meal); return; }
  if(a==='clear'){
    if(b.dataset.confirm){ d.entries=[]; saveDay(); render(); toast('Registro borrado'); }
    else { b.dataset.confirm='1'; b.textContent='¿Seguro? Toque otra vez'; b.style.color='var(--warn)'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.confirm; b.textContent='Borrar registro del día'; b.style.color=''; } },3000); }
    return;
  }
  if(a==='edit'){ state.edit=true; render(); window.scrollTo(0,0); return; }
  if(a==='editdone'){ state.edit=false; savePeople(0); render(); toast('Plan actualizado'); return; }
  if(a==='gen'){ const pl=generatePlan(p); if(!pl){ toast('Complete estatura, edad y peso'); return; } p.meals=pl; savePeople(0); state.tab='plan'; render(); window.scrollTo(0,0); toast('Plan generado'); return; }
  if(a==='addcita'){
    const v=id=>{ const x=parseFloat($('#'+id).value); return isNaN(x)?'':x; };
    const f=$('#c-f').value, peso=v('c-peso'); if(!f||peso===''){ toast('Ponga al menos fecha y peso'); return; }
    p.citas=(p.citas||[]).filter(r=>r.f!==f); p.citas.push({f,peso,grasa:v('c-grasa'),musc:v('c-musc'),gv:v('c-gv'),h2o:v('c-h2o')});
    savePeople(0); render(); toast('Medición guardada'); return;
  }
  if(a==='delcita'){
    if(b.dataset.confirm){ p.citas=p.citas.filter(r=>r.f!==b.dataset.f); savePeople(0); render(); }
    else { b.dataset.confirm='1'; b.textContent='¿borrar?'; b.style.color='var(--warn)'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.confirm; b.textContent='×'; b.style.color='var(--mut)'; } },3000); }
    return;
  }
});
function onField(t){
  const p=P();
  if(t.id==='q'){ state.q=t.value; renderFoods(); return; }
  if(t.dataset.pf){ const k=t.dataset.pf; p[k]=['altura','edad','peso','act'].includes(k)?(parseFloat(t.value)||''):t.value; savePeople(900); renderEnergy(); if(k==='nombre'){ $('#who').textContent=(p.nombre||'')+' '+(p.apellido||''); const pb=document.querySelector(`[data-person="${p.id}"]`); if(pb) pb.textContent=p.nombre||'Sin nombre'; } return; }
  if(t.dataset.ed){
    const k=t.dataset.ed;
    if(k==='agua'){ const v=parseFloat(t.value); if(v>0) p.agua=Math.round(v*1000); }
    else { const m=p.meals[+t.dataset.i]; if(k==='ex'){ m.ex[t.dataset.k]=Math.max(0,parseFloat(t.value)||0); } else m[k]=t.value; }
    savePeople(900);
  }
}
document.addEventListener('input', e=>onField(e.target));
document.addEventListener('change', e=>{ if(e.target.tagName==='SELECT') onField(e.target); });

/* ============ Inicio ============ */
render();
</script>
</body>
</html>
